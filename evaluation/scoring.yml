# Weighted scoring for the durable-queue RL Gym task.
# Weights MUST sum to exactly 1.0 (asserted by evaluation/score.py).
#
# Easy surface (core/cli/dedupe/batch/...) is intentionally tiny (~0.10).
# Most weight is on crash safety, races, fencing, and cross-feature
# interactions — the failure modes strong agentic models still miss even
# when they implement the happy-path commands.
weights:
  interactions: 0.14
  recovery: 0.14
  concurrency: 0.12
  fencing: 0.08
  deps: 0.08
  drain: 0.06
  tags: 0.06
  pause: 0.05
  cancel: 0.05
  retries: 0.04
  lease: 0.04
  schedules: 0.02
  tz: 0.02
  ttl: 0.02
  scheduling: 0.02
  idempotency: 0.02
  batch: 0.01
  claim_batch: 0.01
  cli: 0.01
  dedupe: 0.005
  core: 0.005

# Each category maps to the pytest file whose checks it owns.
files:
  core: test_core.py
  scheduling: test_scheduling.py
  retries: test_retries.py
  dedupe: test_dedupe.py
  lease: test_lease.py
  recovery: test_recovery.py
  concurrency: test_concurrency.py
  idempotency: test_idempotency.py
  batch: test_batch.py
  cli: test_cli.py
  schedules: test_schedules.py
  ttl: test_ttl.py
  fencing: test_fencing.py
  tz: test_tz.py
  claim_batch: test_claim_batch.py
  deps: test_deps.py
  pause: test_pause.py
  cancel: test_cancel.py
  drain: test_drain.py
  tags: test_tags.py
  interactions: test_interactions.py
