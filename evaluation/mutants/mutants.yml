mutants:
  m01_priority:
    bug: claim orders by created_at only, ignoring priority
    file: m01_priority
    must_fail:
    - test_scheduling.py::test_priority_order
  m02_backoff:
    bug: fail sets run_at=now (no exponential backoff)
    file: m02_backoff
    must_fail:
    - test_retries.py::test_fail_backoff_requeue
  m03_dedupe:
    bug: enqueue ignores --dedupe-key (always creates a new job)
    file: m03_dedupe
    must_fail:
    - test_dedupe.py::test_dedupe_same_key_returns_existing
  m04_single_copy:
    bug: state kept in a single file only (no redundant copy); deleting that file
      loses every acknowledged job
    file: m04_single_copy
    must_fail:
    - test_recovery.py::test_delete_any_single_file_preserves_jobs
  m05_lease:
    bug: claim never sweeps expired leases
    file: m05_lease
    must_fail:
    - test_lease.py::test_lease_expiry_reclaim
    - test_lease.py::test_complete_after_lease_expiry_fails
  m06_complete:
    bug: complete() allows completing a non-claimed job
    file: m06_complete
    must_fail:
    - test_cli.py::test_complete_pending_conflict
  m07_delay:
    bug: claim ignores run_at (delayed jobs become claimable at once)
    file: m07_delay
    must_fail:
    - test_scheduling.py::test_delayed_job_not_claimable
  m08_compact:
    bug: compact keeps only pending jobs (done/dead/claimed silently dropped)
    file: m08_compact
    must_fail:
    - test_recovery.py::test_compact_reclaims_disk_space
  m09_nolock:
    bug: lock file opened but never locked; concurrent mutations race
    file: m09_nolock
    must_fail:
    - test_concurrency.py::test_parallel_claim_no_double_delivery
  m10_no_torn_repair:
    bug: _truncate_torn_tail neutered; a torn trailing record is replayed and crashes
      the next command instead of being discarded
    file: m10_no_torn_repair
    must_fail:
    - test_recovery.py::test_torn_append_recovers
  m11_no_dead_letter:
    bug: fail() never sets status dead; jobs retry forever
    file: m11_no_dead_letter
    must_fail:
    - test_retries.py::test_fail_dead_after_max_attempts
  m12_cron:
    bug: cron field validation disabled; malformed expressions accepted
    file: m12_cron
    must_fail:
    - test_schedules.py::test_schedule_malformed_cron_rejected
  m13_ttl:
    bug: TTL sweep disabled; jobs past their TTL never expire
    file: m13_ttl
    must_fail:
    - test_ttl.py::test_ttl_pending_job_expires
  m14_extend:
    bug: extend-lease validates but never updates lease_expires_at
    file: m14_extend
    must_fail:
    - test_lease.py::test_extend_lease_prolongs_claim
  m15_fence:
    bug: claim never increments the fence token (stays 0); stale-fence protection
      can never fire
    file: m15_fence
    must_fail:
    - test_fencing.py::test_fence_starts_zero_bumps_on_claim
    - test_fencing.py::test_complete_stale_fence_rejected
  m16_tz:
    bug: schedule ignores --tz; cron is always evaluated in UTC
    file: m16_tz
    must_fail:
    - test_tz.py::test_tz_new_york_materializes_local_wallclock
  m17_batch_claim:
    bug: claim --count N orders by created_at only, ignoring priority (single-claim
      path unaffected)
    file: m17_batch_claim
    must_fail:
    - test_claim_batch.py::test_claim_count_three_priority_order
  m18_deps:
    bug: claim ignores depends_on (claims blocked jobs)
    file: m18_deps
    must_fail:
    - test_deps.py::test_blocked_until_dependency_done
  m19_pause:
    bug: pause flag not persisted (only in-memory / not loaded)
    file: m19_pause
    must_fail:
    - test_pause.py::test_pause_survives_new_process
  m20_cascade:
    bug: --cascade only cancels direct dependents, not transitive
    file: m20_cascade
    must_fail:
    - test_cancel.py::test_cascade_cancels_transitive_pending
