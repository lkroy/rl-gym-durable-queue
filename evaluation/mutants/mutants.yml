mutants:
  m01_priority:
    bug: claim orders by created_at only, ignoring priority
    file: m01_priority
    must_fail:
    - test_scheduling.py::test_priority_order
  m02_backoff:
    bug: fail sets run_at=now (no exponential backoff)
    file: m02_backoff
    must_fail:
    - test_retries.py::test_fail_backoff_requeue
  m03_dedupe:
    bug: enqueue ignores --dedupe-key (always creates a new job)
    file: m03_dedupe
    must_fail:
    - test_dedupe.py::test_dedupe_same_key_returns_existing
  m04_single_copy:
    bug: state kept in a single file only (no redundant copy); deleting that file
      loses every acknowledged job
    file: m04_single_copy
    must_fail:
    - test_recovery.py::test_delete_any_single_file_preserves_jobs
  m05_lease:
    bug: claim never sweeps expired leases
    file: m05_lease
    must_fail:
    - test_lease.py::test_lease_expiry_reclaim
    - test_lease.py::test_complete_after_lease_expiry_fails
  m06_complete:
    bug: complete() allows completing a non-claimed job
    file: m06_complete
    must_fail:
    - test_cli.py::test_complete_pending_conflict
  m07_delay:
    bug: claim ignores run_at (delayed jobs become claimable at once)
    file: m07_delay
    must_fail:
    - test_scheduling.py::test_delayed_job_not_claimable
  m08_compact:
    bug: compact keeps only pending jobs (done/dead/claimed silently dropped)
    file: m08_compact
    must_fail:
    - test_recovery.py::test_compact_reclaims_disk_space
  m09_nolock:
    bug: lock file opened but never locked; concurrent mutations race
    file: m09_nolock
    must_fail:
    - test_concurrency.py::test_parallel_claim_no_double_delivery
  m10_no_torn_repair:
    bug: _truncate_torn_tail neutered; a torn trailing record is replayed and crashes
      the next command instead of being discarded
    file: m10_no_torn_repair
    must_fail:
    - test_recovery.py::test_torn_append_recovers
  m11_no_dead_letter:
    bug: fail() never sets status dead; jobs retry forever
    file: m11_no_dead_letter
    must_fail:
    - test_retries.py::test_fail_dead_after_max_attempts
