# Acceptance criteria: observable requirements mapped to verifier check IDs.
# Node IDs are pytest node IDs: <test file>::<test function>.
acceptance_criteria:
  REQ-STATE-DIR:
    description: State dir from $QDATA_DIR, default ./.qdata; created if missing.
    checks:
      - test_cli.py::test_stats_empty
      - test_cli.py::test_default_qdata_dir

  REQ-REDUNDANCY:
    description: No single file under $QDATA_DIR is a single point of failure; deleting any one file preserves all acknowledged jobs.
    checks:
      - test_recovery.py::test_delete_any_single_file_preserves_jobs
      - test_core.py::test_state_persisted_to_disk

  REQ-RESTART:
    description: A fresh process sees every previously acknowledged job; state persists across processes.
    checks:
      - test_core.py::test_claim_complete_flow
      - test_core.py::test_state_persisted_to_disk
      - test_recovery.py::test_delete_any_single_file_preserves_jobs

  REQ-CRASH-ATOMICITY:
    description: SIGKILL mid-command never corrupts the queue; the next command exits 0, acknowledged jobs are intact, the in-flight op took effect at most once. A torn trailing record in any state file is discarded automatically.
    checks:
      - test_recovery.py::test_kill_mid_enqueue_never_corrupts
      - test_recovery.py::test_kill_mid_compact_never_loses_jobs
      - test_recovery.py::test_torn_append_recovers
      - test_batch.py::test_batch_kill_mid_batch_all_or_nothing

  REQ-IDEMPOTENCY:
    description: claim --idempotency-key KEY returns the same claimed job on repeat without claiming twice; the key->job mapping is durable and concurrency-safe; the mapping is discarded when its lease expires and when the job goes done/dead; a key not matching ^[A-Za-z0-9_-]{1,64}$ -> exit 2.
    checks:
      - test_idempotency.py::test_idempotency_key_returns_same_job
      - test_idempotency.py::test_idempotency_key_discarded_after_lease_expiry
      - test_idempotency.py::test_idempotency_key_discarded_after_complete
      - test_idempotency.py::test_idempotency_keys_are_independent
      - test_idempotency.py::test_idempotency_key_invalid_format
      - test_idempotency.py::test_idempotency_key_concurrent_same_job

  REQ-BATCH:
    description: enqueue-batch --jobs '<json-array>' validates every element before creating anything (any invalid element -> exit 2, nothing created); dedupe resolves per element including against earlier batch elements; the batch is a single atomic mutation (SIGKILL mid-batch leaves all or none); on success prints a JSON array of ids in input order, exit 0.
    checks:
      - test_batch.py::test_batch_happy_path
      - test_batch.py::test_batch_invalid_element_aborts_everything
      - test_batch.py::test_batch_dedupe_within_batch
      - test_batch.py::test_batch_kill_mid_batch_all_or_nothing

  REQ-COMPACT:
    description: compact preserves every job regardless of status and reclaims disk space once state has grown.
    checks:
      - test_recovery.py::test_compact_reclaims_disk_space
      - test_recovery.py::test_kill_mid_compact_never_loses_jobs

  REQ-CONCURRENCY:
    description: Concurrent processes never deliver the same job twice; mutations are atomic.
    checks:
      - test_concurrency.py::test_parallel_claim_no_double_delivery
      - test_concurrency.py::test_parallel_enqueue_no_lost_or_duplicate_jobs
      - test_concurrency.py::test_parallel_mixed_ops_keep_queue_consistent

  REQ-JOB-FIELDS:
    description: Job fields, types and defaults (id/payload/priority/max_attempts/attempts/status/timestamps/dedupe/lease/last_error/result/fence).
    checks:
      - test_core.py::test_show_roundtrips_payload

  REQ-ENQUEUE:
    description: enqueue prints the job id, exit 0; auto id is 16 hex chars.
    checks:
      - test_core.py::test_enqueue_prints_id

  REQ-ENQUEUE-VALIDATION:
    description: Bad payload JSON / bad id / negative delay / max_attempts<1 / duplicate id -> exit 2.
    checks:
      - test_cli.py::test_bad_payload_json
      - test_cli.py::test_bad_id
      - test_cli.py::test_negative_delay
      - test_cli.py::test_zero_max_attempts
      - test_cli.py::test_duplicate_id

  REQ-DEDUPE:
    description: Same dedupe key with pending/claimed job returns existing id and creates nothing; done key does not block.
    checks:
      - test_dedupe.py::test_dedupe_same_key_returns_existing
      - test_dedupe.py::test_dedupe_key_reusable_after_done

  REQ-LIST:
    description: list prints JSON array of summaries sorted created_at asc, id asc; --status filters.
    checks:
      - test_core.py::test_list_sorted_and_filter

  REQ-SHOW:
    description: show prints full job JSON; unknown id -> stderr contains "job not found", exit 4.
    checks:
      - test_core.py::test_show_roundtrips_payload
      - test_cli.py::test_show_unknown

  REQ-CLAIM:
    description: claim sweeps expired leases first; candidates pending && run_at<=now; order priority desc, created_at asc, id asc; sets claimed_at/lease_expires_at; prints full job JSON; none -> "no jobs available", exit 1; lease<=0 -> exit 2; each claim bumps the job's fence; --count N claims up to N candidates atomically.
    checks:
      - test_core.py::test_claim_complete_flow
      - test_scheduling.py::test_priority_order
      - test_scheduling.py::test_fifo_tiebreak
      - test_scheduling.py::test_delayed_job_not_claimable
      - test_cli.py::test_claim_empty
      - test_cli.py::test_zero_lease
      - test_lease.py::test_lease_expiry_reclaim

  REQ-FENCING:
    description: Every job carries a fence (0 at enqueue); each transition into claimed bumps it by 1 (idempotent re-claim via the same key does not); complete/fail/extend-lease require --fence (missing/bad -> exit 2); unknown id -> 4; not claimed -> "not claimed" exit 3; wrong fence -> "stale fence" exit 3, job untouched; extend-lease never changes the fence.
    checks:
      - test_fencing.py::test_fence_starts_zero_bumps_on_claim
      - test_fencing.py::test_complete_stale_fence_rejected
      - test_fencing.py::test_extend_lease_stale_fence_rejected
      - test_fencing.py::test_complete_missing_fence_rejected
      - test_fencing.py::test_fail_stale_fence_rejected
      - test_fencing.py::test_idempotent_reclaim_keeps_fence
      - test_fencing.py::test_fence_bumps_on_fail_requeue

  REQ-TZ-SCHEDULES:
    description: schedule --tz NAME selects the IANA timezone the cron expression is evaluated in (default UTC; unknown name -> exit 2); job ids use the occurrence's local wall-clock; DST gaps are skipped; ambiguous local times materialize exactly one job at the first occurrence; the schedules summary includes tz.
    checks:
      - test_tz.py::test_schedule_invalid_tz_rejected
      - test_tz.py::test_schedules_default_tz_utc
      - test_tz.py::test_schedules_summary_shows_tz
      - test_tz.py::test_tz_new_york_materializes_local_wallclock
      - test_tz.py::test_utc_schedule_id_uses_utc_wallclock

  REQ-BATCH-CLAIM:
    description: claim --count N atomically claims up to N candidates in claim order (priority desc, created_at asc, id asc), each with its fence bumped; prints a JSON array when --count is passed; --count < 1 or non-integer -> exit 2; --idempotency-key with --count > 1 -> exit 2; concurrent batch claims never overlap.
    checks:
      - test_claim_batch.py::test_claim_count_three_priority_order
      - test_claim_batch.py::test_claim_count_more_than_available
      - test_claim_batch.py::test_claim_count_empty
      - test_claim_batch.py::test_claim_count_invalid
      - test_claim_batch.py::test_claim_count_with_idempotency_key_rejected
      - test_claim_batch.py::test_parallel_claim_count_no_double_delivery

  REQ-EXTEND-LEASE:
    description: extend-lease ID --fence F --lease SEC sets lease_expires_at=now+lease on a claimed job without changing its fence; unknown id -> exit 4; non-claimed -> "not claimed", exit 3; missing/bad --fence -> exit 2; wrong fence -> "stale fence", exit 3; lease<=0 -> exit 2.
    checks:
      - test_lease.py::test_extend_lease_prolongs_claim
      - test_lease.py::test_extend_lease_pending_conflict
      - test_lease.py::test_extend_lease_unknown_id
      - test_lease.py::test_extend_lease_bad_lease
      - test_fencing.py::test_extend_lease_stale_fence_rejected

  REQ-SCHEDULES:
    description: schedule creates recurring schedules with full cron grammar (timezone-aware via --tz, default UTC; dom/dow OR-rule); due occurrences materialize as jobs with deterministic ids on every command; unschedule removes the schedule but keeps jobs; malformed cron -> exit 2; end-at excludes occurrences.
    checks:
      - test_schedules.py::test_schedule_every_minute_materializes
      - test_schedules.py::test_unschedule_stops_but_keeps_jobs
      - test_schedules.py::test_schedule_malformed_cron_rejected
      - test_schedules.py::test_schedule_end_at_past_materializes_nothing
      - test_schedules.py::test_schedule_kill_during_materialization

  REQ-TTL:
    description: enqueue --ttl>0 else exit 2; pending jobs past TTL -> dead with last_error "expired"; claimed jobs exempt while lease valid, dead (not requeued) once lease expires.
    checks:
      - test_ttl.py::test_ttl_pending_job_expires
      - test_ttl.py::test_ttl_claimed_job_exempt_while_lease_valid
      - test_ttl.py::test_ttl_claimed_job_dead_after_lease_expiry
      - test_ttl.py::test_ttl_delayed_job_expires_before_claimable
      - test_ttl.py::test_ttl_nonpositive_rejected

  REQ-COMPLETE:
    description: complete ID --fence F requires claimed (else "not claimed", exit 3); unknown -> exit 4; missing/bad --fence -> exit 2; wrong fence -> "stale fence", exit 3; bad result JSON -> exit 2; sets done + result.
    checks:
      - test_core.py::test_claim_complete_flow
      - test_cli.py::test_complete_pending_conflict
      - test_fencing.py::test_complete_stale_fence_rejected
      - test_fencing.py::test_complete_missing_fence_rejected

  REQ-FAIL:
    description: fail ID --fence F requires claimed (else exit 3); unknown -> exit 4; missing/bad --fence -> exit 2; wrong fence -> "stale fence", exit 3; attempts+=1; attempts>=max_attempts -> dead else pending with run_at=now+10*2**(attempts-1), lease cleared, last_error set; the fence is not reset.
    checks:
      - test_retries.py::test_fail_backoff_requeue
      - test_retries.py::test_fail_dead_after_max_attempts
      - test_retries.py::test_fail_pending_conflict
      - test_fencing.py::test_fail_stale_fence_rejected

  REQ-STATS:
    description: stats prints pending/claimed/done/dead/total counts, exit 0.
    checks:
      - test_core.py::test_stats_counts
      - test_cli.py::test_stats_empty

  REQ-EXIT-CODES:
    description: 0 ok / 1 no jobs / 2 usage-validation / 3 state conflict / 4 not found; unknown command -> 2.
    checks:
      - test_cli.py::test_unknown_command
      - test_cli.py::test_claim_empty
      - test_cli.py::test_complete_pending_conflict
      - test_cli.py::test_show_unknown

  REQ-DEPS:
    description: Jobs carry depends_on (default []); enqueue --depends-on and batch depends_on; claimable only when pending, run_at<=now, and every dependency is done; unmet higher-priority deps do not block lower-priority ready jobs; unknown/self/empty/cycle deps -> exit 2 (cycle stderr contains cycle); batch validates cycles as a whole before creating anything; pending jobs whose any dependency is dead become dead with last_error "dependency failed" (cascading fixpoint after TTL sweep); show/claim include depends_on; schedule-materialized jobs get depends_on [].
    checks:
      - test_deps.py::test_blocked_until_dependency_done
      - test_deps.py::test_priority_skipped_over_unmet_deps
      - test_deps.py::test_cycle_rejected
      - test_deps.py::test_unknown_dep_rejected
      - test_deps.py::test_dep_dead_cascades_dependent
      - test_deps.py::test_batch_depends_on_earlier_element
      - test_deps.py::test_ttl_expiry_of_dep_kills_dependent

  REQ-PAUSE:
    description: q pause / q resume set durable meta flags (survives process restart); resume clears BOTH paused and draining; claim while paused -> exit 1 "queue paused" except in-flight idempotency-key retry; enqueue and other non-claim commands still work while paused; pause does not prevent complete/fail of already-claimed jobs; background obligations still run while paused.
    checks:
      - test_pause.py::test_claim_rejected_while_paused
      - test_pause.py::test_pause_survives_new_process
      - test_pause.py::test_enqueue_while_paused_then_resume_claim
      - test_pause.py::test_resume_then_claim_succeeds
      - test_pause.py::test_pause_allows_complete_and_fail_of_claimed
      - test_interactions.py::test_pause_idempotency_inflight_vs_new

  REQ-CANCEL:
    description: q cancel ID [--cascade] requires pending (else "not pending" exit 3); unknown id -> 4; sets dead/last_error "cancelled"; without --cascade prints id; with --cascade also cancels transitive pending dependents (NOT claimed) and prints sorted JSON id array including root; cascade must not change unrelated pending jobs; cancelling one branch must not kill a non-dependent sibling; discard idempotency mappings; non-cascade leave dependents to die later via dependency-failed obligation.
    checks:
      - test_cancel.py::test_cancel_pending_to_dead_cancelled
      - test_cancel.py::test_cancel_claimed_not_pending
      - test_cancel.py::test_cascade_cancels_transitive_pending
      - test_cancel.py::test_without_cascade_dependent_becomes_dependency_failed
      - test_cancel.py::test_cascade_does_not_affect_unrelated_pending
      - test_cancel.py::test_cancel_branch_does_not_kill_sibling

  REQ-DRAIN:
    description: q drain sets durable draining=true (survives restart); enqueue/enqueue-batch/schedule while draining -> exit 3 stderr contains "draining", create nothing; drain does not remove or alter already-enqueued jobs (they remain claimable); claim/complete/fail/cancel/list/show/stats/compact/unschedule/pause/extend-lease still work; resume clears BOTH paused and draining; if paused and draining, claim uses pause rule.
    checks:
      - test_drain.py::test_drain_blocks_enqueue
      - test_drain.py::test_drain_blocks_schedule
      - test_drain.py::test_claim_works_while_draining
      - test_drain.py::test_resume_clears_drain
      - test_drain.py::test_drain_survives_new_process
      - test_drain.py::test_pause_and_drain_claim_uses_pause
      - test_drain.py::test_drain_preserves_enqueued_jobs

  REQ-TAGS:
    description: Job field tag (string or null, default null) always present in show/claim; enqueue --tag / batch tag must match ^[A-Za-z0-9_-]{1,32}$ else exit 2; schedule-materialized tag null; claim without --tag only null-tag jobs; claim --tag TAG only exact match; hard partition; completing a tagged job must not affect untagged pending jobs; dedupe global; deps/priority/run_at/pause/drain apply on top.
    checks:
      - test_tags.py::test_untagged_claim_skips_tagged_jobs
      - test_tags.py::test_tagged_claim_skips_untagged_jobs
      - test_tags.py::test_invalid_tag_rejected
      - test_tags.py::test_claim_count_with_tags_only_matching
      - test_tags.py::test_priority_order_within_same_tag
      - test_tags.py::test_complete_tagged_leaves_untagged_claimable

  REQ-PAUSE-IDEMP:
    description: While paused, claim --idempotency-key KEY that maps to a currently claimed unexpired job returns that job (same fence, lease not extended) exit 0; otherwise claim while paused -> exit 1 queue paused.
    checks:
      - test_interactions.py::test_pause_idempotency_inflight_vs_new
      - test_pause.py::test_claim_rejected_while_paused

  REQ-INTERACTIONS:
    description: Cross-feature interactions — pause+schedule materialize, pause+idempotency, claim --count skipping unmet deps, waiter TTL expires as expired while dep pending, cascade skips claimed dependents, drain+batch, fail-requeue blocks dependents, tagged-on-untagged deps, compact preserves meta/tag/depends_on, parallel mixed-tag claims.
    checks:
      - test_interactions.py::test_pause_schedule_materialize_then_resume_claim
      - test_interactions.py::test_pause_idempotency_inflight_vs_new
      - test_interactions.py::test_claim_count_skips_blocked_deps_fills_ready
      - test_interactions.py::test_waiter_ttl_expires_as_expired_while_dep_pending
      - test_interactions.py::test_cascade_does_not_cancel_claimed_dependents
      - test_interactions.py::test_drain_blocks_batch_existing_completable
      - test_interactions.py::test_fail_requeue_dep_keeps_dependent_blocked
      - test_interactions.py::test_tagged_depends_on_untagged_dep
      - test_interactions.py::test_compact_preserves_meta_and_fields
      - test_interactions.py::test_parallel_claim_mixed_tags_no_double_delivery
